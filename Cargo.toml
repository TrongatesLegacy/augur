[workspace]
members = ["engine", "app"]
resolver = "2"

[workspace.package]
version = "0.1.13"
edition = "2021"
license = "UNLICENSED"
publish = false

# Thin LTO over 16 codegen units: the installers build about 3.5 times faster than with whole-program LTO in one unit
# (Augur's own crates, which every release rebuilds: 34s against 123s on an M-series Mac), for an app about 5 MB bigger
[profile.release]
lto = "thin"
opt-level = "s"
strip = true

# The same lints everywhere. CI runs Clippy with every warning as an error (cargo clippy -- -D warnings).
[workspace.lints.rust]
unsafe_code = "deny" # the two Windows system calls that need it are allowed where they are, with a comment

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
